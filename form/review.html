<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Received | Time Circuit Reviews</title>
  <meta name="description" content="Confirmation page for a submitted product review.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Audiowide&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/review.js"></script>
</head>

<body>

  <main>
    <div class="console">

      <div class="console-header">
        <span class="status-dot" aria-hidden="true"></span>
        <p class="eyebrow">Temporal Hardware Division</p>
        <h1>Review Received</h1>
        <p class="subtitle">Your feedback has been logged to the archive</p>
      </div>

      <div class="console-body">
        <div class="confirmation-icon" aria-hidden="true">&check;</div>

        <ul class="summary-list" id="summary-list">
          <!-- Populated dynamically by js/review.js -->
        </ul>

        <div class="counter-panel">
          <span class="counter-label">Total Reviews Submitted</span>
          <span class="counter-value" id="review-counter">0</span>
        </div>

        <a class="back-link" href="form.html">&larr; Submit another review</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="copy-year"></span> Peter Ella Bisong</p>
    <p>Abuja, Nigeria</p>
    <p>Last Modification: <span id="last-modified"></span></p>
  </footer>
</body>

</html>
